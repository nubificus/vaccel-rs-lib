[package]
name = "vagent"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.26", features = ["fs","rt-multi-thread", "macros", "process", "sync", "signal"] }
dns-lookup = {version = "1.0.8"}
nix = "0.26.2"
anyhow = "^1.0"
vaccel-rpc-agent = { git = "https://github.com/nubificus/vaccel-rust", branch="main", optional = true }

[features]
integrated = ["dep:vaccel-rpc-agent"]
